<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" aria-hidden="true">
  <defs>
    <linearGradient id="bread-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c9a0"/>
      <stop offset="50%" style="stop-color:#c49b6a"/>
      <stop offset="100%" style="stop-color:#8b7355"/>
    </linearGradient>
  </defs>
  <circle cx="40" cy="40" r="38" fill="#faf6f1" stroke="#b85c38" stroke-width="2.5"/>
  <!-- Boule: round loaf, ellipse centered in badge -->
  <ellipse cx="40" cy="42" rx="22" ry="20" fill="url(#bread-bg)" stroke="#5c4033" stroke-width="1.2"/>
  <!-- Single curved score across the top -->
  <path fill="none" stroke="#5c4033" stroke-width="0.9" stroke-linecap="round" opacity="0.5" d="M22 38 Q40 32 58 38"/>
</svg>
